[project]
name = "kagurax"
version = "1.0.0"
description = "阴阳师游戏自动化脚本工具（KaguraX），提供现代化 Web 界面管理和 ADB 手机自动化功能"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.68.0",
    "starlette>=1.3.0",
    "uvicorn[standard]",
    "jinja2>=3.0.0",
    "requests",
    "uiautomator2",
    "opencv-python-headless",
    "numpy",
    "rapidocr",
    "onnxruntime>=1.16.0; python_version>='3.11'",
    "onnxruntime>=1.16.0,<1.21; python_version<'3.11'",
    "python-multipart",
]

[project.urls]
Homepage = "https://github.com/Duckyal/KaguraX"
Repository = "https://github.com/Duckyal/KaguraX"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api", "module", "tasks"]
