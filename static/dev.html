<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <title>AutoScript - 开发控制台</title>
  <link rel="icon" href="/static/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="/static/css/dev/dev.css?v={{ time_now }}">
</head>
<body>
    <header class="header">
      <div class="header-left">
        <h1>
          <a href="/" style="text-decoration: none; color: #f7f8f7;">AutoScript(主页)</a>
          <span> &gt;&gt; </span>
          设备(<span id="device-name" style="color: #f7f8f7;">加载中...</span> )
        </h1>
      </div>
      <div style="display: flex; gap: 8px; align-items: center;">
        <a href="/home?device={{device}}" class="toggle-sidebar-btn" style="text-decoration: none;">转到设备页</a>
        <button class="toggle-sidebar-btn" id="toggle-btn">隐藏工具栏</button>
      </div>
    </header>

    <div class="main-container">
      
      <!-- 左侧：视频流 -->
      <div class="stream-section">
        <div class="stream-container" id="stream-container">
          <img id="stream-img" src="/api/stream?device={{device}}" alt="Video Stream" style="width: 100%; height: 100%; object-fit: contain; pointer-events:none;">
          <div id="selection-overlay" style="
              position: absolute; 
              border: 2px dashed #22c55e; 
              background-color: rgba(34, 197, 94, 0.2); 
              display: none; 
              pointer-events: none; 
              z-index: 10;">
          </div>
        </div>
      </div>

      <!-- 右侧：可隐藏侧边栏 -->
      <div class="sidebar" id="sidebar">
        
        <div class="tool-card">
          <h3>模式与保存设置</h3>
        
        <div class="control-box">
          <input type="checkbox" id="screenshot-mode"> 
          <label for="screenshot-mode" style="cursor:pointer;">拉框截图模式(中键切换)</label>
        </div>

        <div class="input-group">
          <div style="display: flex; align-items: center; gap: 8px;">
            <label for="stream-interval">截图间隔 (毫秒)：</label>
            <span id="stream-interval-value" style="font-size: 12px; color: #6b7280;">50ms (约20fps)</span>
          </div>
          <div style="display: flex; gap: 8px;">
            <input type="number" id="stream-interval" min="1" max="60" step="1" value="30" 
                   style="flex: 1; padding: 8px 12px; border: 1px solid #d1d5db; border-radius: 4px; font-size: 14px;">
            <button id="btn-set-interval" class="btn" style="padding: 8px 16px; background-color: #3b82f6; color: white; border: none; border-radius: 4px; font-size: 13px; cursor: pointer;">设置</button>
          </div>
        </div>

        <div class="input-group">
          <label for="folder-path">保存目录路径（默认项目下tasks/tmp目录）：</label>
          <input type="text" id="folder-path" value="./tasks/tmp">
        </div>

        <div class="input-group">
          <label for="file-name">保存文件名 (不带后缀，必填)：</label>
          <input type="text" id="file-name" placeholder="例如: my_shot" required>
        </div>

        <div class="upload-area" style="margin-bottom: 12px;">
          <label style="font-size:14px;color:#6b7280;display:block;margin-bottom:8px;">框选区域预览：</label>
          <img id="crop-preview" src="" alt="请在左侧框选或下方选择图片" style="display:none; max-width:100%; max-height:120px; border-radius:4px; border: 1px solid #e5e7eb;">
        </div>

        <!-- 区域参数（找图找字共用） -->
          <div style="margin-bottom: 12px; padding: 10px; background-color: #f9fafb; border-radius: 4px;">
            <label style="font-size: 13px; color: #374151; font-weight: bold;">区域坐标（-1表示全屏，支持小数）：</label>
            <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-top: 8px;">
              <div>
                <label style="font-size: 11px; color: #6b7280;">x1</label>
                <input type="text" id="region-x1" value="-1" style="width: 100%; padding: 3px; font-size: 12px; border: 1px solid #d1d5db; border-radius: 3px;">
              </div>
              <div>
                <label style="font-size: 11px; color: #6b7280;">y1</label>
                <input type="text" id="region-y1" value="-1" style="width: 100%; padding: 3px; font-size: 12px; border: 1px solid #d1d5db; border-radius: 3px;">
              </div>
              <div>
                <label style="font-size: 11px; color: #6b7280;">x2</label>
                <input type="text" id="region-x2" value="-1" style="width: 100%; padding: 3px; font-size: 12px; border: 1px solid #d1d5db; border-radius: 3px;">
              </div>
              <div>
                <label style="font-size: 11px; color: #6b7280;">y2</label>
                <input type="text" id="region-y2" value="-1" style="width: 100%; padding: 3px; font-size: 12px; border: 1px solid #d1d5db; border-radius: 3px;">
              </div>
            </div>
            <button id="btn-clear-region" style="width: 100%; margin-top: 8px; padding: 4px; font-size: 12px; border: 1px solid #d1d5db; border-radius: 3px; background-color: #f3f4f6; color: #374151; cursor: pointer;">清除截图/恢复默认值</button>
          </div>

        <!-- 上传按钮 -->
        <button id="upload-btn" class="btn" style="width: 100%; margin-bottom: 12px; font-size: 12px; padding: 6px; background-color: #f3f4f6; color: #374151; border: 1px solid #d1d5db;">📂 上传本地图片</button>
        <input type="file" id="file-input" hidden accept="image/*"><!-- 新增：上传按钮 -->

        <button class="btn" id="save-btn">保存</button>

        <!-- ============ 图像识别 ============ -->
        <div style="margin-top: 20px; border-top: 1px solid #e5e7eb; padding-top: 15px;">
          <h3 style="font-size: 16px; margin-bottom: 10px;">辅助功能</h3>
          
          <!-- 找图参数 -->
          <div style="margin-bottom: 12px; padding: 10px; background-color: #f9fafb; border-radius: 4px;">
            <label style="font-size: 13px; color: #374151; font-weight: bold;">找图参数：</label>
            <div style="display: flex; gap: 8px; margin-top: 8px;">
              <div style="flex: 1;">
                <label style="font-size: 12px; color: #6b7280;">相似度 (0-1)</label>
                <input type="number" id="find-img-sim" min="0" max="1" step="0.01" value="0.90" 
                       style="width: 100%; padding: 4px; font-size: 12px; border: 1px solid #d1d5db; border-radius: 3px;">
              </div>
              <div style="flex: 1;">
                <label style="font-size: 12px; color: #6b7280;">角优先度</label>
                <select id="find-img-corner" style="width: 100%; padding: 4px; font-size: 12px; border: 1px solid #d1d5db; border-radius: 3px;">
                  <option value="tl">左上角</option>
                  <option value="tr">右上角</option>
                  <option value="bl">左下角</option>
                  <option value="br">右下角</option>
                </select>
              </div>
            </div>
          </div>

          <!-- 找字参数 -->
          <div style="margin-bottom: 12px; padding: 10px; background-color: #f9fafb; border-radius: 4px;">
            <label style="font-size: 13px; color: #374151; font-weight: bold;">找字参数：</label>
            <div style="margin-top: 8px;">
              <input type="text" id="find-text-target" placeholder="目标文本（支持正则）" 
                     style="width: 100%; padding: 4px; font-size: 12px; border: 1px solid #d1d5db; border-radius: 3px; margin-bottom: 4px;">
              <label style="font-size: 12px; color: #6b7280; display: flex; align-items: center; gap: 4px;">
                <input type="checkbox" id="find-text-regex"> 使用正则匹配
              </label>
            </div>
          </div>

          <div style="display: flex; gap: 10px; margin-bottom: 10px;">
            <button id="btn-find-image" class="btn" style="flex: 1; background-color: #eff6ff; color: #2563eb; border: 1px solid #bfdbfe;">找图</button>
            <button id="btn-find-text" class="btn" style="flex: 1; background-color: #eff6ff; color: #2563eb; border: 1px solid #bfdbfe;">找字 (OCR)</button>
          </div>
          
          <div>
            <label style="font-size:14px; color:#6b7280; display:block; margin-bottom:5px;">识别结果返回值：</label>
            <textarea id="recognition-result" rows="4" placeholder="等待操作..." readonly 
                style="width: 100%; padding: 8px; border: 1px solid #d1d5db; border-radius: 4px; background-color: #f9fafb; font-family: monospace; font-size: 12px; color: #374151; resize: vertical; box-sizing: border-box;"></textarea>
          </div>
        </div>

      </div>
    </div>
  
  {% if not device_ok %}
    <div style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-color: rgba(0, 0, 0, 0.7); backdrop-filter: blur(6px); display: flex; justify-content: center; align-items: center; z-index: 99999;">
      <div style="width: 360px; max-width: 90vw; padding: 32px 28px; background: rgba(49, 50, 68, 0.95); border: 1px solid rgba(243, 139, 168, 0.4); border-radius: 12px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6); text-align: center; color: #cdd6f4; font-family: 'Segoe UI', sans-serif;">
        <svg style="color: #f38ba8; margin-bottom: 12px; display: block; margin-left: auto; margin-right: auto;" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
          <line x1="12" y1="9" x2="12" y2="13"></line>
          <line x1="12" y1="17" x2="12.01" y2="17"></line>
        </svg>
        <h3 style="font-size: 20px; color: #f38ba8; margin: 0 0 10px 0; font-weight: 600;">ADB 设备不可用</h3>
        <p style="font-size: 14px; color: #a6adc8; margin: 0 0 8px 0; word-break: break-all;">设备：{{ device }}</p>
        <p style="font-size: 14px; color: #a6adc8; margin: 0 0 8px 0; word-break: break-all;">原因：{{ device_msg }}</p>
        <p style="font-size: 12px; color: #6c7086; margin-bottom: 22px;">请确认设备已通过 USB 或网络连接，并返回重新选择</p>
        <button style="width: 100%; padding: 12px; background-color: #89b4fa; color: #1e1e2e; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer;"
                onclick="window.location.href='/'">返回设备选择</button>
      </div>
    </div>

    <script>
        document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') { e.preventDefault(); }
        });
    </script>
  {% endif %}

  <script src="/static/js/dev/scrcpy.js?v={{ time_now }}"></script>

</body>
</html>
