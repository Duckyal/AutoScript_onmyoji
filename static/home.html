<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AutoScript - 主页</title>
  <!-- 网页图标 -->
  <link rel="icon" href="/static/favicon.ico" type="image/x-icon">
  <!-- CSS 文件 -->
  <link rel="stylesheet" href="/static/css/home/variables.css?v={{ time_now }}">
  <link rel="stylesheet" href="/static/css/home/reset.css?v={{ time_now }}">
  <link rel="stylesheet" href="/static/css/home/layout.css?v={{ time_now }}">
  <link rel="stylesheet" href="/static/css/home/header.css?v={{ time_now }}">
  <link rel="stylesheet" href="/static/css/home/sidebar-task.css?v={{ time_now }}">
  <link rel="stylesheet" href="/static/css/home/content.css?v={{ time_now }}">
  <link rel="stylesheet" href="/static/css/home/terminal.css?v={{ time_now }}">
  <link rel="stylesheet" href="/static/css/home/form.css?v={{ time_now }}">
</head>
<body>
  <!-- 顶部标题栏 -->
  <header class="header">
    <h1 class="header__title">
      <span class="header__title-main">AutoScript - 主页 &gt;&gt; 设备({{device}}) &gt;&gt; </span>
      <span class="header__title-process" id="taskName"></span>
    </h1>

    <button class="header__start-btn" id="startBtn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
        <polygon points="5,3 19,12 5,21"></polygon>
      </svg>
      执行
    </button>
    
  </header>

  <!-- 主容器 -->
  <div class="main-container">
    <!-- 右侧内容区域 -->
    <div class="content-wrapper">

      <!-- 上方 2/3：任务侧边栏和内容 -->
      <div class="content-upper">
        <!-- 任务侧边栏 -->
        <aside class="sidebar-task">
          <h2 class="sidebar-task__title">任务</h2>
          <ul class="sidebar-task__list" id="taskList"></ul>
        </aside>

        <!-- 任务内容区域 -->
        <main class="content-main" id="contentMain">
          <!-- 
          任务配置要点
            1. 每个任务配置面板都必须有一个唯一的 id，该 id 与任务脚本的文件名保持一致, 
              例如 "panel-yuhun"，则执行脚本时后端会初始化/tasks/yuhun.py脚本里的Task_yuhun类。
            2. 每个任务配置面板都必须有一个 data-name 属性，该属性的值将用于在任务列表中显示任务名称。
            3. 每个任务配置面板内的表单元素必须有一个唯一的 name 属性，该属性将用于在提交任务时传递参数。
            4. 每个任务配置面板内的表单元素必须由<div class="form-group">包裹
            5. 除第一个任务配置面板外，其他面板都应通过 style="display: none;" 来隐藏。
            -->

          <!-- 御魂配置 -->
          <div class="task-panel" id="panel-yuhun" data-name="御魂(暂未实现)">
            <h3 class="task-panel__title">御魂配置</h3>
            <div class="form-group">
              <label class="form-label" for="layer">挑战层数</label>
              <select class="form-select" id="layer" name="layer">
                <option value="10">魂十</option>
                <option value="11">魂十一</option>
                <option value="12">魂十二</option>
              </select>
              
              <label class="form-label" for="count">挑战次数(0为不限)</label>
              <input class="form-input" type="number" id="count" name="count" value="100" min="0">
              
              <label class="form-label" for="team">组队模式</label>
              <select class="form-select" id="team" name="team">
                <option value="solo">单人</option>
                <option value="leader">队长</option>
                <option value="member">队员</option>
              </select>
              
              <label class="form-label" for="mode">更多日志</label>
              <select class="form-select" id="mode" name="mode">
                <option value="less">否</option>
                <option value="more">是</option>
              </select>
            </div>
          </div>

          <!-- 御灵配置 -->
          <div class="task-panel" id="panel-yuling" data-name="御灵">
            <h3 class="task-panel__title">御灵配置</h3>
            <div class="form-group">
              <label class="form-label" for="boss">挑战对象</label>
              <select class="form-select" id="boss" name="boss">
                <option value="暗神龙">暗神龙</option>
                <option value="暗白藏主">暗白藏主</option>
                <option value="暗黑豹">暗黑豹</option>
                <option value="暗朱雀">暗朱雀</option>
              </select>

              <label class="form-label" for="layer">挑战层数</label>
              <select class="form-select" id="layer" name="layer">
                <option value="三层">第三层</option>
                <option value="二层">第二层</option>
                <option value="一层">第一层</option>
              </select>
              
              <label class="form-label" for="count">挑战次数(0为不限)</label>
              <input class="form-input" type="number" id="count" name="count" value="100" min="0">
              
              <label class="form-label" for="mode">更多日志</label>
              <select class="form-select" id="mode" name="mode">
                <option value="less">否</option>
                <option value="more">是</option>
              </select>
            </div>
          </div>

          <!-- 斗技配置 -->
          <div class="task-panel" id="panel-douji" style="display: none;" data-name="斗技">
            <h3 class="task-panel__title">斗技配置</h3>
            <div class="form-group">
              <label class="form-label" for="count">挑战次数</label>
              <select class="form-select" id="count" name="count">
                <option value="none">不限次数</option>
                <option value="point">荣誉点满</option>
              </select>
              
              <label class="form-label" for="refresh">重新挑战次数</label>
              <input class="form-input" type="number" id="refresh" name="refresh" value="3" min="1">

              <label class="form-label" for="mode">更多日志</label>
              <select class="form-select" id="mode" name="mode">
                <option value="less">否</option>
                <option value="more">是</option>
              </select>
            </div>
          </div>

          <!-- 突破配置 -->
          <div class="task-panel" id="panel-tupo" style="display: none;" data-name="突破">
            <h3 class="task-panel__title">突破配置</h3>
            <div class="form-group">
              <label class="form-label" for="type">突破类型</label>
              <select class="form-select" id="type" name="type">
                <option value="个人突破">个人突破</option>
                <option value="寮突破">寮突破</option>
              </select>
              
              <label class="form-label" for="refresh">自动刷新</label>
              <select class="form-select" id="refresh" name="refresh">
                <option value="yes">是</option>
                <option value="no">否</option>
              </select>
              
              <label class="form-label" for="mode">更多日志</label>
              <select class="form-select" id="mode" name="mode">
                <option value="less">否</option>
                <option value="more">是</option>
              </select>
            </div>
          </div>

          <!-- 困28配置 -->
          <div class="task-panel" id="panel-k28" style="display: none;" data-name="困28">
            <h3 class="task-panel__title">困28配置</h3>
            <div class="form-group">
              <label class="form-label" for="count">突破上限(0为不清)</label>
              <input class="form-input" type="number" id="count" name="count" value="25" min="0" max="30">

              <label class="form-label" for="lunhuan">轮换狗粮(二星)</label>
              <select class="form-select" id="lunhuan" name="lunhuan">
                <option value="素材">素材</option>
                <option value="N卡">N卡</option>
              </select>
              
              <label class="form-label" for="mode">更多日志</label>
              <select class="form-select" id="mode" name="mode">
                <option value="less">否</option>
                <option value="more">是</option>
              </select>
            </div>
          </div>

          <!-- 英杰配置 -->
          <div class="task-panel" id="panel-yinjie" style="display: none;" data-name="英杰">
            <h3 class="task-panel__title">英杰配置</h3>
            <div class="form-group">
              <label class="form-label" for="type">挑战类型</label>
              <select class="form-select" id="type" name="type">
                <option value="yuan">源赖光(暂未实现)</option>
                <option value="tengyuan">藤原道长</option>
              </select>        
              
              <label class="form-label" for="mode">更多日志</label>
              <select class="form-select" id="mode" name="mode">
                <option value="less">否</option>
                <option value="more">是</option>
              </select>
            </div>
          </div>
          
          <!-- 活动配置 -->
          <div class="task-panel" id="panel-huodong" style="display: none;" data-name="活动">
            <h3 class="task-panel__title">活动配置</h3>
            <div class="form-group">
              <label class="form-label" for="type">活动类型</label>
              <select class="form-select" id="type" name="type">
                <option value="normal">爬塔</option>
                <option value="else">其他(暂未实现)</option>
              </select>
              
              <label class="form-label" for="count">挑战次数(0为不限)</label>
              <input class="form-input" type="number" id="count" name="count" value="100" min="0">
              
              <label class="form-label" for="mode">更多日志</label>
              <select class="form-select" id="mode" name="mode">
                <option value="less">否</option>
                <option value="more">是</option>
              </select>
            </div>
          </div>

        </main>
      </div>

      <!-- 下方 1/3：终端界面 -->
      <div class="terminal">
        <div class="terminal__header">
          <span class="terminal__title">输出日志</span>
          <div class="terminal__buttons">
            <button class="terminal__auto-scroll-btn" id="autoScrollBtn" title="滚动切换">滚动</button>
            <button class="terminal__clear-btn" id="clearTerminalBtn" title="清空日志">清空</button>
          </div>
        </div>
        <div class="terminal__body" id="terminalBody"></div>
      </div>
    </div>
  </div>

   <!-- 设备校验失败时才渲染，不可关闭，仅提供返回 -->
  {% if not device_ok %}
    <div style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-color: rgba(0, 0, 0, 0.7); backdrop-filter: blur(6px); display: flex; justify-content: center; align-items: center; z-index: 99999;">
      <div style="width: 360px; max-width: 90vw; padding: 32px 28px; background: rgba(49, 50, 68, 0.95); border: 1px solid rgba(243, 139, 168, 0.4); border-radius: 12px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6); text-align: center; color: #cdd6f4; font-family: 'Segoe UI', sans-serif;">
        <svg style="color: #f38ba8; margin-bottom: 12px; display: block; margin-left: auto; margin-right: auto;" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
          <line x1="12" y1="9" x2="12" y2="13"></line>
          <line x1="12" y1="17" x2="12.01" y2="17"></line>
        </svg>
        <h3 style="font-size: 20px; color: #f38ba8; margin: 0 0 10px 0; font-weight: 600;">ADB 设备不可用</h3>
        <p style="font-size: 14px; color: #a6adc8; margin: 0 0 8px 0; word-break: break-all;">设备：{{ device }}</p>
        <p style="font-size: 14px; color: #a6adc8; margin: 0 0 8px 0; word-break: break-all;">原因：{{ device_msg }}</p>
        <p style="font-size: 12px; color: #6c7086; margin-bottom: 22px;">请确认设备已通过 USB 或网络连接，并返回重新选择</p>
        <button style="width: 100%; padding: 12px; background-color: #89b4fa; color: #1e1e2e; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer;"
                onclick="window.location.href='/'">返回设备选择</button>
      </div>
    </div>

    <script>
        document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') { e.preventDefault(); }
        });
    </script>
  {% endif %}
   
  <!-- JavaScript 文件 -->
  <script src="/static/js/home/task.js?v={{ time_now }}"></script>
  <script src="/static/js/home/terminal.js?v={{ time_now }}"></script>
  <script src="/static/js/home/app.js?v={{ time_now }}"></script>
</body>
</html>
