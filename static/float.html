<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>KaguraX - 悬浮遥控</title>
  <script>
    // 运行环境识别：悬浮窗 WebView(FloatingWindowService) 在 UA 里带 KaguraXFloat 后缀，
    // 其余（App「打开网页」全屏 WebView / 浏览器）视为完整页。日志区据此布局：
    //  - env-float：只显示最新一行，保持小窗紧凑
    //  - env-full ：日志多行铺满剩余高度，滚动浏览
    document.documentElement.classList.add(
      /KaguraXFloat/i.test(navigator.userAgent) ? 'env-float' : 'env-full'
    );
  </script>
  <link rel="icon" href="/static/favicon_round.png" type="image/png">
  <link rel="stylesheet" href="/static/css/float/float.css?v={{ time_now }}">
</head>
<body>
  <!-- 供 JS 读取的服务端注入值（当前设备，可选，供悬浮窗 URL 直接指定） -->
  <script>
    window.PAGE_DEVICE = {{ device|tojson }};
  </script>

  <div class="float-app">

    <!-- 顶栏：左侧项目名 · 右侧 收起按钮(仅悬浮窗) + 开始/终止按钮 -->
    <header class="float-header">
      <!-- 顶栏左侧徽标 = 收起按钮：圆形 logo + KaguraX 名称合成一个按钮，无其他图标。
           仅悬浮窗环境(env-float)响应点击，经 KaguraXBridge.collapse() JS 桥收起小窗回到悬浮球；
           完整页/浏览器里徽标为纯展示 -->
      <button class="float-brand" id="floatCollapseBtn" type="button"
              title="收起悬浮窗" aria-label="收起悬浮窗">
        <img class="float-brand__logo" src="/static/favicon_round.png" alt="">
        KaguraX
      </button>
      <button class="action" id="actionBtn" disabled>
        <span class="action__icon" id="actionIcon">
          <svg viewBox="0 0 24 24" fill="currentColor"><polygon points="6,3 20,12 6,21"></polygon></svg>
        </span>
        <span id="actionLabel">请选择设备</span>
      </button>
    </header>

    <!-- 设备 -->
    <section class="pane pane--dev">
      <label class="pane__label" for="deviceSel">被控设备</label>
      <div class="pane__row">
        <select class="ctl ctl--select ctl--device" id="deviceSel"></select>
        <button class="btn-refresh" id="deviceRefreshBtn" title="刷新设备列表">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="23 4 23 10 17 10"></polyline>
            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
          </svg>
        </button>
      </div>
      <div class="dev-hint" id="devHint" hidden></div>
    </section>

    <!-- 任务选择 -->
    <nav class="chips" id="chipRow"></nav>

    <!-- 参数 -->
    <section class="pane pane--cfg">
      <div id="cfgBody"></div>
      <div class="cfg-hint" id="customHint" hidden></div>
    </section>

    <!-- 运行状态 + 最近日志 -->
    <section class="pane pane--status">
      <div class="statusline">
        <span class="statusline__dot" id="stateDot"></span>
        <span class="statusline__text" id="stateText">未选择设备</span>
        <span class="statusline__spacer"></span>
        <span class="statusline__task" id="runningTask" hidden></span>
      </div>
      <div class="lastlog" id="lastLog">设备运行日志将在这里滚动显示</div>
    </section>

  </div>

  <!-- 轻提示 -->
  <div class="toast" id="toast" hidden></div>

  <script src="/static/js/float/float.js?v={{ time_now }}"></script>
</body>
</html>
