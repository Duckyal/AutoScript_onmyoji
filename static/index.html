<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AutoScript - 设备启动器</title>
  <link rel="icon" href="/static/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="/static/css/index/index.css?v={{ time_now }}">
</head>
<body>
  <div class="launcher-card">
    <div class="launcher-title">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect>
        <line x1="12" y1="18" x2="12.01" y2="18"></line>
      </svg>
      adb设备连接
    </div>

    <div class="form-group">
      <label class="form-label" for="deviceInput">选择或输入设备序列号</label>
      <input class="form-input" list="adbDevices" id="deviceInput" placeholder="请选择或输入设备ID" autocomplete="off">
      <datalist id="adbDevices">
        <!-- JS 会动态往这里插入 option -->
      </datalist>
      <div class="status-text" id="statusText"></div>
    </div>

    <div style="display: flex; gap: 12px; width: 100%;">
      <!-- 设备页按钮 -->
      <button class="btn" id="loginBtn" style="flex: 1; display: flex; align-items: center; justify-content: center; color: #ffffff;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 6px;">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
        设备页
      </button>
      <!-- 开发页按钮 -->
      <a class="btn" id="devBtn" style="flex: 1; display: flex; align-items: center; justify-content: center; text-decoration: none; color: #ffffff;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 6px;">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
        开发页
      </a>
    </div>
        
    <br>
    <button class="refresh-btn" id="refreshBtn">刷新设备列表</button>
  </div>

  <script src="/static/js/index/login.js?v={{ time_now }}"></script>
  <script>
    (async function () {
    try {
        const r = await fetch('/api/wallpaper');
        const data = await r.json();
        if (data.url) {
        document.body.style.backgroundImage = `url(${data.url})`;
        document.body.style.backgroundSize = 'cover';
        }
    } catch (e) { 
        console.error(e); }
    })();
  </script>
</body>
</html>
