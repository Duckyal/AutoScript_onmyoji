<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AutoScript - 设备启动器</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <style>
    html, body {
      width: 100%;       /* 强制宽度占满全屏 */
      height: 100%;      /* 强制高度占满全屏 */
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #1e1e2e;
      background-size: cover;       /* 确保图片覆盖整个区域 */
      background-position: center;  /* 确保图片居中 */
      background-repeat: no-repeat; /* 禁止图片平铺 */
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #cdd6f4;
    }
    .launcher-card {
      background: rgba(49, 50, 68, 0.75); /* 将纯色背景改为半透明 (0.75是透明度，可自行调整0~1) */
      border: 1px solid rgba(255, 255, 255, 0.15); /* 加一条微微透亮的边框，提升质感 */
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      width: 360px;
      text-align: center;
      position: relative;
    }
    .launcher-title {
      margin-bottom: 30px;
      font-size: 24px;
      color: #89b4fa;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .form-group {
      margin-bottom: 25px;
      text-align: left;
      position: relative;
    }
    .form-label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      color: #a6adc8;
    }
    .form-input {
      width: 100%;
      padding: 12px;
      box-sizing: border-box;
      border-radius: 8px;
      border: 2px solid #45475a;
      background-color: #1e1e2e;
      color: #cdd6f4;
      font-size: 14px;
      transition: border-color 0.3s;
    }
    .form-home:focus {
      outline: none;
      border-color: #89b4fa;
    }
    .btn {
      width: 100%;
      padding: 12px;
      background-color: #89b4fa;
      color: #1e1e2e;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.3s, transform 0.1s;
    }
    .btn:hover {
      background-color: #74c7ec;
    }
    .btn:active {
      transform: scale(0.98);
    }
    .refresh-btn {
      background: none;
      border: none;
      color: #a6adc8;
      cursor: pointer;
      font-size: 12px;
      margin-top: 15px;
      text-decoration: underline;
    }
    .refresh-btn:disabled {
      color: #585b70;
      cursor: not-allowed;
    }
    .status-text {
      font-size: 12px;
      color: #f38ba8; /* 错误提示用红色 */
      margin-top: 10px;
      height: 16px;
    }
  </style>
</head>
<body>
  <div class="launcher-card">
    <div class="launcher-title">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect>
        <line x1="12" y1="18" x2="12.01" y2="18"></line>
      </svg>
      adb设备连接
    </div>

    <div class="form-group">
      <label class="form-label" for="deviceInput">选择或输入设备序列号stream_manager</label>
      <input class="form-input" list="adbDevices" id="deviceInput" placeholder="请选择或输入设备ID">
      <datalist id="adbDevices">
        <!-- JS 会动态往这里插入 option -->
      </datalist>
      <div class="status-text" id="statusText"></div>
    </div>

    <div style="display: flex; gap: 12px; width: 100%;">
      <!-- 设备页按钮 -->
      <button class="btn" id="loginBtn" style="flex: 1; display: flex; align-items: center; justify-content: center; color: #ffffff;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 6px;">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
        设备页
      </button>
      <!-- 开发页按钮 -->
      <a class="btn" id="devBtn" style="flex: 1; display: flex; align-items: center; justify-content: center; text-decoration: none; color: #ffffff;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 6px;">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
        开发页
      </a>
    </div>
        
    <br>
    <button class="refresh-btn" id="refreshBtn">刷新设备列表</button>
  </div>

  <script src="js/index/login.js"></script>
  <script>
    (async function () {
    try {
        const r = await fetch('/api/wallpaper');
        const data = await r.json();
        if (data.url) {
        document.body.style.backgroundImage = `url(${data.url})`;
        document.body.style.backgroundSize = 'cover';
        }
    } catch (e) { 
        console.error(e); }
    })();
  </script>
</body>
</html>
